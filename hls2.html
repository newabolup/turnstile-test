<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>HLS JS test</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
<h1>HLS JS test</h1>
<video id="v" width="640" height="360" controls autoplay muted playsinline></video>
<p id="status">the player loads the stream from JavaScript; the URL is NOT in the page HTML.</p>
<script>
  var video = document.getElementById('v');
  var src = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
  }
</script>
</body>
</html>
